version: 2

updates:

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/src/frontend/titanmdm-web"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: "/integrations/ponches/backend"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
    open-pull-requests-limit: 10