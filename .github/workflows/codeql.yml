name: CodeQL

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "30 4 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

jobs:

  analyze-dotnet:

    name: Analyze CSharp

    runs-on: windows-latest

    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: |
          dotnet restore TitanMDM.slnx
          dotnet build TitanMDM.slnx --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v3


  analyze-javascript:

    name: Analyze JavaScript TypeScript

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3