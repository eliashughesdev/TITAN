name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-backend:

    name: Build .NET

    runs-on: windows-latest

    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: >
          dotnet restore
          TitanMDM.slnx

      - name: Build
        run: >
          dotnet build
          TitanMDM.slnx
          --configuration Release
          --no-restore

      - name: Unit tests
        run: >
          dotnet test
          tests/TitanMDM.UnitTests/TitanMDM.UnitTests.csproj
          --configuration Release
          --no-build
          --verbosity normal

      - name: Integration tests
        run: >
          dotnet test
          tests/TitanMDM.IntegrationTests/TitanMDM.IntegrationTests.csproj
          --configuration Release
          --no-build
          --verbosity normal