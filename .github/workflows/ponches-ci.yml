name: Ponches Python CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "integrations/ponches/backend/**"
      - ".github/workflows/ponches-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "integrations/ponches/backend/**"
      - ".github/workflows/ponches-ci.yml"

permissions:
  contents: read

jobs:
  python-validation:

    name: Validate Ponches Backend

    runs-on: windows-latest

    timeout-minutes: 20

    defaults:
      run:
        working-directory: integrations/ponches/backend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/ponches/backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall app

      - name: Run pytest if tests exist
        shell: pwsh
        run: |
          if (Test-Path ".\tests") {
              python -m pytest tests -q
          }
          else {
              Write-Host "No Python tests directory found yet."
          }